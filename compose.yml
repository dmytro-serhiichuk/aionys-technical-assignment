services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      Frontend__Url: http://localhost:${FRONTEND_PORT:-3000}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: 
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:${BACKEND_PORT:-5000}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  postgres_data: